<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="50%" stop-color="#00D97A"/>
      <stop offset="100%" stop-color="#8DC63F"/>
    </linearGradient>
    <linearGradient id="seedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- Caule ondulado (onda azul→verde da logo) -->
  <path d="M2 52 Q10 44 22 50 Q34 56 46 42" stroke="url(#stemGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Centro do dente-de-leão -->
  <circle cx="46" cy="30" r="5" fill="#8DC63F"/>

  <!-- Hastes verdes (parte verde do dente-de-leão) -->
  <!-- cima -->
  <line x1="46" y1="25" x2="44" y2="10" stroke="#8DC63F" stroke-width="1" stroke-linecap="round"/>
  <!-- cima-dir -->
  <line x1="50" y1="26" x2="54" y2="12" stroke="#8DC63F" stroke-width="1" stroke-linecap="round"/>
  <!-- dir-cima -->
  <line x1="51" y1="29" x2="60" y2="18" stroke="#8DC63F" stroke-width="1" stroke-linecap="round"/>
  <!-- esq-cima -->
  <line x1="41" y1="26" x2="34" y2="14" stroke="#8DC63F" stroke-width="1" stroke-linecap="round"/>
  <!-- esq -->
  <line x1="41" y1="30" x2="32" y2="24" stroke="#8DC63F" stroke-width="1" stroke-linecap="round"/>
  <!-- esq-baixo -->
  <line x1="42" y1="34" x2="34" y2="42" stroke="#8DC63F" stroke-width="1" stroke-linecap="round"/>
  <!-- baixo-esq -->
  <line x1="45" y1="35" x2="42" y2="46" stroke="#8DC63F" stroke-width="1" stroke-linecap="round"/>

  <!-- Hastes laranja (sementes voando) -->
  <!-- dir voando -->
  <line x1="51" y1="28" x2="62" y2="22" stroke="#F5A623" stroke-width="1" stroke-linecap="round"/>
  <!-- dir-cima voando -->
  <line x1="50" y1="25" x2="58" y2="12" stroke="#F5A623" stroke-width="1" stroke-linecap="round"/>
  <!-- cima voando -->
  <line x1="47" y1="25" x2="48" y2="8"  stroke="#F5A623" stroke-width="1" stroke-linecap="round"/>

  <!-- Bolinhas verdes (cabeças das sementes verdes) -->
  <circle cx="44" cy="9"  r="1.8" fill="none" stroke="#8DC63F" stroke-width="0.8"/>
  <circle cx="54" cy="11" r="1.8" fill="none" stroke="#8DC63F" stroke-width="0.8"/>
  <circle cx="61" cy="17" r="1.8" fill="none" stroke="#8DC63F" stroke-width="0.8"/>
  <circle cx="31" cy="13" r="1.8" fill="none" stroke="#8DC63F" stroke-width="0.8"/>
  <circle cx="31" cy="23" r="1.8" fill="none" stroke="#8DC63F" stroke-width="0.8"/>
  <circle cx="33" cy="43" r="1.8" fill="none" stroke="#8DC63F" stroke-width="0.8"/>
  <circle cx="41" cy="47" r="1.8" fill="none" stroke="#8DC63F" stroke-width="0.8"/>

  <!-- Bolinhas laranja (sementes voando) -->
  <circle cx="63" cy="21" r="1.8" fill="none" stroke="#F5A623" stroke-width="0.8"/>
  <circle cx="59" cy="10" r="1.8" fill="none" stroke="#F5A623" stroke-width="0.8"/>
  <circle cx="48" cy="6"  r="1.8" fill="none" stroke="#F5A623" stroke-width="0.8"/>
</svg>
