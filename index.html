<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOPRO</title>
    
  </head>

  <body>
    <div id="root"></div>

    

    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  
    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    function aplicarZIndexVLibras(ativo) {
      const valor = ativo ? '99999' : '5';

      const seletoresEstaticos = [
        'div[vw]',
        'div[vw-access-button]',
        'div[vw-plugin-wrapper]',
        '.vw-plugin-top-wrapper'
      ];

      seletoresEstaticos.forEach(seletor => {
        document.querySelectorAll(seletor).forEach(el => {
          el.style.setProperty('z-index', valor, 'important');
        });
      });

      // iframe do boneco animado
      document.querySelectorAll('iframe').forEach(el => {
        if (el.src && el.src.includes('vlibras')) {
          el.style.setProperty('z-index', valor, 'important');
        }
      });
    }

    function observarVLibras() {
      // Rebaixa tudo na inicialização
      aplicarZIndexVLibras(false);

      // Observa o botão de acesso para detectar ativação
      const botao = document.querySelector('[vw-access-button]');
      if (botao) {
        botao.addEventListener('click', () => {
          // Pequeno delay para o VLibras montar o painel
          setTimeout(() => {
            // Se o plugin-wrapper estiver visível/expandido, eleva
            const wrapper = document.querySelector('[vw-plugin-wrapper]');
            const estaAtivo = wrapper && 
              (wrapper.classList.contains('active') || 
              wrapper.style.display !== 'none' ||
              wrapper.offsetHeight > 0);
            aplicarZIndexVLibras(estaAtivo);
          }, 100);
        });
      }

      // MutationObserver como fallback: detecta quando o VLibras 
      // adiciona/remove classes ou exibe o boneco
      const observer = new MutationObserver(() => {
        const wrapper = document.querySelector('[vw-plugin-wrapper]');
        const iframe = document.querySelector('iframe[src*="vlibras"]');

        const wrapperAtivo = wrapper && wrapper.offsetHeight > 50;
        const iframeAtivo  = iframe  && iframe.offsetHeight  > 0;

        aplicarZIndexVLibras(wrapperAtivo || iframeAtivo);
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'style']
      });
    }

    window.addEventListener('load', () => {
      aplicarZIndexVLibras(false);
      setTimeout(observarVLibras, 1500); // aguarda o plugin montar
    });
  </script>

  </body>
</html>
